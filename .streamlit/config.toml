[theme]
# Dark theme by default; user can switch in the menu.
base = "dark"
primaryColor = "#2E75B6"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1B1F2A"
textColor = "#E6E6E6"

[server]
headless = true
enableXsrfProtection = false
enableCORS = false

# Required for embeds
[runner]
magicEnabled = true

[browser]
gatherUsageStats = false